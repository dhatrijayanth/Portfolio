<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lavender + tree mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Georama:wght@400;500;600&family=Platypi:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --plaster: #e6e2dc;
        --stone: #d4cfc6;
        --ink: #1f1c19;
        --sap: #5c7a3a;
        --sap-soft: #7a9a52;
        --terracotta: #c45c38;
        --terracotta-soft: #d47858;
        --lavender: #8b7aad;
        --lavender-deep: #6a5a8c;
        --lavender-soft: #b5a8c9;
        --lavender-pale: #d4cce0;
        --stem: #5c7a3a;
        --font-sans: "Georama", sans-serif;
        --font-display: "Platypi", serif;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: var(--font-sans);
        color: var(--ink);
        background: #1f1c19;
        line-height: 1.5;
      }

      .wrap {
        max-width: 64rem;
        margin: 0 auto;
        padding: 1.25rem 1rem 2.5rem;
      }

      .intro {
        color: #f7f5f1;
        margin-bottom: 1rem;
      }

      .intro h1 {
        font-family: var(--font-display);
        font-size: 1.55rem;
        margin: 0 0 0.35rem;
      }

      .intro p {
        margin: 0;
        color: #b5a8c9;
        font-size: 0.92rem;
        max-width: 42rem;
      }

      .hero-mock {
        position: relative;
        min-height: 34rem;
        padding: clamp(1.5rem, 4vw, 2.75rem);
        display: flex;
        align-items: flex-end;
        overflow: hidden;
        border-radius: 1.5rem 0.75rem 1.6rem 1rem;
        background:
          radial-gradient(ellipse 80% 60% at 75% 30%, rgba(92, 122, 58, 0.22), transparent 55%),
          radial-gradient(ellipse 50% 40% at 18% 40%, rgba(139, 122, 173, 0.1), transparent 55%),
          radial-gradient(ellipse 70% 50% at 20% 80%, rgba(196, 92, 56, 0.18), transparent 50%),
          linear-gradient(145deg, #ddd6cc 0%, var(--plaster) 45%, #cfc8bc 100%);
      }

      .hero-content {
        position: relative;
        z-index: 4;
        max-width: 28rem;
      }

      .role-wrap {
        position: relative;
        display: inline-block;
        margin: 0 0 0.85rem;
        padding: 5.6rem 0.2rem 0.1rem;
      }

      .role-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 5.1rem;
        height: 1.5px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--sap) 8%,
          var(--sap) 88%,
          transparent 100%
        );
        opacity: 0.55;
        z-index: 2;
      }

      .hero-role {
        position: relative;
        z-index: 3;
        font-size: 1.35rem;
        color: var(--sap);
        margin: 0;
        letter-spacing: 0.04em;
      }

      .hero-name {
        font-family: var(--font-display);
        font-size: clamp(2.1rem, 5vw, 3.2rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin: 0 0 0.55rem;
      }

      .hero-line {
        font-size: 0.92rem;
        color: var(--sap);
        margin: 0 0 0.4rem;
      }

      .hero-tagline {
        font-size: 0.98rem;
        margin: 0;
        max-width: 24rem;
      }

      .hero-tree-wrap {
        position: absolute;
        right: clamp(0.25rem, 3vw, 2rem);
        bottom: clamp(0.5rem, 2vh, 1.5rem);
        width: min(52vw, 28rem);
        z-index: 2;
        pointer-events: none;
      }

      .hero-leaves {
        position: absolute;
        left: 4%;
        right: 4%;
        top: 2%;
        height: 78%;
        z-index: 3;
      }

      .leaf {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: 2rem;
        height: 3rem;
        background: var(--sap);
        border-radius: 2% 90% 10% 90%;
        opacity: 0.7;
        transform: translate(-50%, -50%) rotate(var(--r)) scale(var(--s));
        transform-origin: 50% 80%;
        animation: leaf-drift 16s ease-in-out infinite;
        animation-delay: var(--d);
      }

      .leaf::after {
        content: "";
        position: absolute;
        left: 48%;
        top: 12%;
        bottom: 10%;
        width: 1px;
        background: rgba(31, 28, 25, 0.22);
        transform: translateX(-50%);
      }

      .leaf--terra {
        background: linear-gradient(160deg, var(--terracotta-soft), var(--terracotta));
        opacity: 0.68;
      }

      .leaf--sap {
        background: linear-gradient(160deg, var(--sap-soft), var(--sap));
        opacity: 0.72;
      }

      .hero-tree {
        display: block;
        width: 100%;
        height: auto;
        opacity: 0.95;
        position: relative;
        z-index: 1;
      }

      .sprig {
        position: absolute;
        width: 2.3rem;
        height: 5.4rem;
        pointer-events: none;
        transform-origin: 50% 100%;
        z-index: 1;
        bottom: calc(100% - 5.1rem);
      }

      .sprig__stem {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 2px;
        height: 100%;
        transform: translateX(-50%);
        background: linear-gradient(180deg, var(--sap-soft), var(--stem));
        border-radius: 999px;
      }

      .sprig__bloom {
        position: absolute;
        left: 50%;
        width: 0.95rem;
        height: 2.7rem;
        transform: translateX(-50%);
        top: 0.1rem;
      }

      .bud {
        position: absolute;
        left: 50%;
        width: 0.4rem;
        height: 0.52rem;
        border-radius: 60% 60% 55% 55%;
        background: linear-gradient(160deg, var(--lavender-pale), var(--lavender));
        transform: translateX(-50%);
      }

      .bud:nth-child(odd) {
        background: linear-gradient(160deg, var(--lavender-soft), var(--lavender-deep));
        width: 0.36rem;
        height: 0.48rem;
      }

      .sprig__leaf {
        position: absolute;
        width: 0.8rem;
        height: 1.25rem;
        border-radius: 80% 10% 80% 10%;
        background: linear-gradient(160deg, var(--sap-soft), var(--stem));
        opacity: 0.85;
      }

      .sprig__leaf--l {
        left: -0.1rem;
        bottom: 1.5rem;
        transform: rotate(-48deg);
      }

      .sprig__leaf--r {
        right: -0.1rem;
        bottom: 2rem;
        transform: rotate(42deg);
      }

      .sprig--a {
        left: 1.4rem;
        height: 4.8rem;
        transform: rotate(-16deg);
        animation: sway-a 7s ease-in-out infinite;
      }

      .sprig--b {
        left: 5.8rem;
        height: 5.6rem;
        transform: rotate(7deg);
        animation: sway-b 8.5s ease-in-out infinite;
        animation-delay: -2s;
      }

      .sprig--b .sprig__bloom { height: 3rem; }

      .sprig--c {
        left: 10.4rem;
        height: 4.4rem;
        transform: rotate(-5deg);
        animation: sway-c 6.5s ease-in-out infinite;
        animation-delay: -1.2s;
      }

      .sprig--c .sprig__bloom { height: 2.3rem; }

      @keyframes leaf-drift {
        0%, 100% { transform: translate(-50%, -50%) rotate(var(--r)) scale(var(--s)); }
        50% { transform: translate(calc(-50% + 6px), calc(-50% - 10px)) rotate(calc(var(--r) + 6deg)) scale(var(--s)); }
      }

      @keyframes sway-a {
        0%, 100% { transform: rotate(-16deg); }
        50% { transform: rotate(-10deg) translateY(-3px); }
      }

      @keyframes sway-b {
        0%, 100% { transform: rotate(7deg); }
        50% { transform: rotate(2deg) translateY(-4px); }
      }

      @keyframes sway-c {
        0%, 100% { transform: rotate(-5deg); }
        50% { transform: rotate(0deg) translateY(-2px); }
      }

      @media (max-width: 700px) {
        .hero-tree-wrap {
          width: min(58vw, 16rem);
          opacity: 0.9;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .leaf, .sprig { animation: none; }
      }
    </style>
  </head>
